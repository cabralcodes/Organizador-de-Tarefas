<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="SupeirorBar">
        <p>"Organizador de Tarefas"</p>
    </nav>
    <div class="container">
        <!--Barra Superior-->
        <!--Colunas de cada status das tarefas-->
        <div class="ContainerAfazer">
        <div class="AfazerTittle">            
            <p>A Fazer</p>
        </div>
            <div class="AddTarefa">
               <input type="text" name="NomeTarefa" id="IdNomeTarefa" placeholder="Tarefa...">
                <button class="BotaoAddTarefa">Adicionar Tarefa</button>
            </div>
        
            </div>

            <div class="ContainerFazendo">
            <div class="FazendoTittle">
                <p>Fazendo</p>
            </div>
                <div class="CardTarefa">
                    <p>Tarefa Exemplo</p>
                </div>
            </div>

            <div class="ContainerFeito">
                <div class="FeitoTittle">
                    <p>Feito</p>
               </div>
                <div class="TarefaFeito">
                    <p>Tarefa Exemplo</p>
                </div>
                
            </div>    
    </div>
</body>
</html>
