<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="SupeirorBar">
        <p>"Organizador de Tarefas"</p>
    </nav>
    <div class="container" id="Container">
        <ul >
            
            <li>
                <div class="Columns" id="IdContainerAfazer">
                    <div class="AfazerTittle">
                        <p>A Fazer</p>
                    </div>
                    <div class="AddTarefa">
                        <input type="text" name="NomeTarefa" id="IdNomeTarefa" placeholder="Tarefa...">
                        <button class="BotaoAddTarefa" id="IdBtnTarefa">Adicionar Tarefa</button>
                    </div>
                    <div class="CardTarefa" draggable="true">
                       <section >
                        Teste
                       </section>
                       <div class="ContainerBtns">
                           <button class="SalvarNovoNome">Salvar</button>
                           <button class="BotaoEditarTarefa"><img src="./images/rubbishbin_102620.png" alt="Apagar"></button>
                       </div>
                       
                    </div>
                </div>
            </li>
            <li>
                <div class="Columns" id="IdContainerFazendo">
                    <div class="FazendoTittle">
                        <p>Fazendo</p>
                    </div>
                    <div class="CardTarefa" draggable="true">
                        <p class="TituloTarefa">Tarefa Exemplo</p>
                        <div class="ContainerBotoes">
                            <button class="BotaoEditarTarefa"><img src="./images/pencil_112448.png" alt="Editar"></button>
                            <button class="BotaoEditarTarefa"><img src="./images/rubbishbin_102620.png" alt="Apagar"></button>
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="Columns ContainerFeito"  id="IdContainerFeito">
                <div class="FeitoTittle">
                    <p>Feito</p>
                    </div>
                    <div class="TarefaFeito" id="IdContainerFeito" >
                        <p>Tarefa Exemplo</p>
                    </div>
                </div>
            </li>
            
        </ul>    
    
    </div>
    <script src="script.js" defer></script>
</body>
</html>
