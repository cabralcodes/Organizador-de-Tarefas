<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de tarefas</title>
</head>
<body>
    <div class="container">
        <!--Barra Superior-->
        <nav class="supeirorBar">
            <p>"Organizador de Tarefas"</p>
        </nav>
        <!--Colunas de cada status das tarefas-->
        <div class="containerAfazer">
        <div class="AfazerTittle">            
            <p>A Fazer</p>
        </div>
            <div class="AddTarefa">
                <textarea name="NomeTarefa" id="NomeTarefa" placeholder="Tarefa..."></textarea>
                <button class="AddBotao"></button>
            </div>
                <div class="CardTarefa">
                    <button class="Checkbotao"></button>
                </div>
            </div>

            <div class="containerFazendo">
            <div class="FazendoTittle">
                <p>Fazendo</p>
            </div>
                <div class="CardTarefa">
                    <button class="Checkbotao"></button>
                </div>
            </div>

            <div class="containerFeito">
                <div class="FeitoTittle">
                    <p>Feito</p>
               </div>
                <div class="TarefaFeito">
                    <button class="CheckBotao"></button>
                    <p>Tarefa Exemplo</p>
                </div>
                
            </div>    
    </div>
</body>
</html>
