<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="SupeirorBar">
        <p>"Organizador de Tarefas"</p>
    </nav>
    <div class="container" id="Container">
        <ul >
            
            <li>
                <div class="Columns ColunaAfazer" id="IdContainerAfazer" >
                    <div class="AfazerTittle">
                        <p>A Fazer</p>
                    </div>
                    <div class="AddTarefa">
                        <input type="text" name="NomeTarefa" id="IdNomeTarefa" placeholder="Tarefa...">
                        <button class="BotaoAddTarefa" id="IdBtnTarefa">Adicionar Tarefa</button>
                    </div>
                    
                </div>
            </li>
            <li>
                <div class="Columns ColunaFazendo" id="IdContainerFazendo">
                    <div class="FazendoTittle">
                        <p>Fazendo</p>
                    </div>
                   
                </div>
            </li>
            <li>
                <div class="Columns ContainerFeito"  id="IdContainerFeito">
                <div class="FeitoTittle">
                    <p>Feito</p>
                    </div>
                   
                </div>
            </li>
            
        </ul>    
    
    </div>
    <script src="script.js" defer></script>
</body>
</html>
